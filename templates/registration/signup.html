{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block page_class %} page--center{% endblock %}
{% block content %}
  <section class="card card--narrow">
    <h1>Регистрация</h1>
    <form class="auth-form" method="post" style="margin-top: 16px">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn--block" type="submit">Зарегистрироваться</button>
    </form>
    <p class="auth-links"><a href="{% url 'login' %}">Уже есть аккаунт? Войти</a></p>
  </section>
{% endblock %}
